name: flexiyo
description: Secure one-to-one encrypted messaging powered by the Signal Protocol.
# NOTE: libsignal_protocol_dart is GPL-3.0 licensed.
# By including it, this application is subject to GPL-3.0 terms.

publish_to: 'none'

version: 1.0.2+10002

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.1.0

  # HTTP client
  dio: ^5.4.3+1

  # WebSocket (Cloudflare Workers compatible)
  web_socket_channel: ^3.0.1

  # Signal Protocol E2EE (GPL-3.0)
  libsignal_protocol_dart: ^0.8.2

  # Secure storage for keys/JWT
  flutter_secure_storage: ^11.2.0

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.0
  shared_preferences: 2.3.5

  # Media: camera, gallery, voice notes, AES-GCM for media encryption
  camera: ^0.12.1
  photo_manager: ^3.12.0
  record: ^7.1.2
  audioplayers: ^6.0.0
  cryptography: ^2.8.0

  # Icons
  hugeicons: ^1.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  # Used by the web Google button to render the GIS button itself so it can be
  # sized to match the app's buttons.
  google_identity_services_web: ^0.3.3
  web: ^1.1.0
  sqflite_common_ffi_web: ^1.2.0
  sqflite_common_ffi: ^2.4.4
  google_fonts: ^9.0.0
  # Push notifications (Android via Firebase Cloud Messaging)
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  image: ^4.12.0
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  config:
    enable-swift-package-manager: false

