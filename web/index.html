<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flexiyo is a private messaging app for end-to-end encrypted conversations and sharing photos and voice notes.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0175C2">
  <link rel="canonical" href="https://flexiyo.pages.dev/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Flexiyo — Private, Encrypted Messaging">
  <meta property="og:description" content="Private messaging with end-to-end encrypted conversations, photo sharing, and voice notes.">
  <meta property="og:url" content="https://flexiyo.pages.dev/">
  <meta property="og:image" content="https://flexiyo.pages.dev/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flexiyo — Private, Encrypted Messaging">
  <meta name="twitter:description" content="Private messaging with end-to-end encrypted conversations, photo sharing, and voice notes.">
  <meta name="twitter:image" content="https://flexiyo.pages.dev/icons/Icon-512.png">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Flexiyo",
          "url": "https://flexiyo.pages.dev/"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Flexiyo",
          "applicationCategory": "CommunicationApplication",
          "operatingSystem": "Web, Android, iOS",
          "description": "A private messaging app for end-to-end encrypted conversations and sharing photos and voice notes.",
          "url": "https://flexiyo.pages.dev/"
        }
      ]
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flexiyo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flexiyo — Private, Encrypted Messaging</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Splash screen shown while Flutter loads */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0175C2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      margin-bottom: 24px;
    }
    .splash-logo svg {
      width: 56px;
      height: 56px;
    }
    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .splash-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 32px;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-spinner { animation: none; border-top-color: transparent; }
      .splash-spinner::after { content: "Loading…"; display: block; text-align: center; color: white; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0175C2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="splash-title">Flexiyo</div>
    <div class="splash-subtitle">Private, Encrypted Messaging</div>
    <div class="splash-spinner" aria-label="Loading"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide splash screen once Flutter has initialized
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.classList.add('hidden');
    });
    // Fallback: hide after 10s even if Flutter fails to load
    setTimeout(function () {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.classList.add('hidden');
    }, 10000);
  </script>
</body>
</html>
