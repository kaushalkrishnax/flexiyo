name: flexiyo
description: Secure one-to-one encrypted messaging powered by the Signal Protocol.
# NOTE: libsignal_protocol_dart is GPL-3.0 licensed.
# By including it, this application is subject to GPL-3.0 terms.

publish_to: 'none'

version: 1.0.2-beta.1+10002

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP client
  dio: ^5.4.3+1

  # WebSocket (Cloudflare Workers compatible)
  web_socket_channel: ^3.0.1

  # Signal Protocol E2EE (GPL-3.0)
  libsignal_protocol_dart: ^0.8.2

  # Secure storage for keys/JWT
  flutter_secure_storage: ^9.2.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # Media: camera, gallery, voice notes, AES-GCM for media encryption
  camera: ^0.12.1
  photo_manager: ^3.12.0
  record: ^7.1.2
  audioplayers: ^6.0.0
  cryptography: ^2.8.0

  # Icons
  cupertino_icons: ^1.0.8
  icon_plus: ^0.1.1
  google_sign_in: ^6.2.1
  sqflite_common_ffi_web: ^1.2.0
  sqflite_common_ffi: ^2.4.4
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  config:
    enable-swift-package-manager: false

