name = "flexiyo"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "flexiyo-db"
database_id = "a6d142a0-1b62-44b8-86b1-68f802eeaf54"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "flexiyo-media"

[triggers]
crons = ["0 * * * *"]

[vars]
CORS_ORIGIN = "https://flexiyo.pages.dev"
# Media TTL in days; daily per-user byte caps; max single upload size.
MEDIA_TTL_DAYS = "14"
MEDIA_DAILY_UPLOAD_BYTES = "52428800"
MEDIA_DAILY_DOWNLOAD_BYTES = "209715200"
MEDIA_MAX_UPLOAD_BYTES = "26214400"

[dev]
port = 8787
local_protocol = "http"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true