name = "flexiyo-worker"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "flexiyo-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

[vars]
CORS_ORIGIN = "http://localhost:3000"
# GitHub repository that publishes release APKs for the in-app updater.
# Format: owner/repo
UPDATE_GITHUB_REPO = "kaushalkrishnax/flexiyo"
# GitHub repository that publishes release APKs for the in-app updater.
# Format: owner/repo
UPDATE_GITHUB_REPO = "kaushalkrishnax/flexiyo"

# JWT_SECRET must be set as a secret:
# wrangler secret put JWT_SECRET
